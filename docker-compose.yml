# Local development: `docker compose up -d`, then open http://localhost:8000
services:
  app:
    build: ./docker/php
    container_name: nischoyota-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    # Database settings come from .env (DB_HOST=mysql), so phpunit.xml can switch tests to nischoyota_testing.
    environment:
      COMPOSER_PROCESS_TIMEOUT: 0
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: nischoyota-mysql
    environment:
      MYSQL_DATABASE: nischoyota
      MYSQL_USER: nischoyota
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30

  node:
    image: node:22-alpine
    container_name: nischoyota-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    profiles: ["tools"]

volumes:
  mysql-data:
  vendor:
